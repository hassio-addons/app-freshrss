server_name     $hostname;

# FreshRSS keeps its application code one level above the directory it wants
# served. Only `p` is meant to be reachable over HTTP; the library code, the
# console scripts and the data directory all sit outside of it.
root            /var/www/freshrss/p;
index           index.php;

add_header X-Content-Type-Options nosniff;
add_header X-Robots-Tag none;

# OPML imports and favicon uploads are the largest things sent this way.
client_max_body_size 64M;

location / {
    try_files $uri $uri/ /index.php;
}

# `expires` is used rather than `add_header Cache-Control`, because an
# `add_header` here would replace, not extend, the headers set above.
location ~* \.(css|gif|ico|jpg|jpeg|js|png|svg|webp|woff|woff2)$ {
    expires 30d;
}

# Themes ship their licence and documentation next to the stylesheets they
# serve, and third-party themes may add more of the same.
location ~ ^/themes/.*(\.(md|sh)|/[^./]+)$ {
    deny all;
}

# Apache and IIS configuration that ships alongside the application.
location ~ /(\.ht|Web\.config) {
    deny all;
}
