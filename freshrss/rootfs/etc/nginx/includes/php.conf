fastcgi_pass 127.0.0.1:9000;
fastcgi_index index.php;

# Importing a large OPML file fetches every feed in it before answering.
fastcgi_read_timeout 900;

# FreshRSS' Google Reader and Fever APIs put their route in the path that
# follows the script name, so PATH_INFO has to be handed over. PHP-FPM does
# not set it by itself, and $fastcgi_path_info is reset the moment it is read,
# hence the detour via a variable of our own.
# See https://trac.nginx.org/nginx/ticket/321
fastcgi_split_path_info ^(.+\.php)(/.*)$;
set $path_info $fastcgi_path_info;
fastcgi_param PATH_INFO $path_info;

fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

include /etc/nginx/includes/fastcgi_params.conf;

# FreshRSS reads the name of an externally authenticated user from these two,
# and only trusts them when they arrive from an address listed in its own
# trusted_sources setting. They are cleared regardless: a fastcgi_param named
# after a request header makes NGINX drop that header instead of passing it
# on, and an empty value means nothing is sent in its place. So whatever a
# client puts in them never reaches PHP.
fastcgi_param HTTP_REMOTE_USER "";
fastcgi_param HTTP_X_WEBAUTH_USER "";
