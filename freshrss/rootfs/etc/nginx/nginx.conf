# Run nginx in foreground.
daemon off;

# This is run inside Docker.
user root;

# Pid storage location.
pid /var/run/nginx.pid;

# Set number of worker processes.
worker_processes 1;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

# Write error log to the app log.
error_log /proc/1/fd/1 error;

# Load dynamic modules.
include /etc/nginx/modules/*.conf;

# Max num of simultaneous connections by a worker process.
events {
    worker_connections 512;
}

http {
    include /etc/nginx/includes/mime.types;

    access_log              off;
    client_max_body_size    4G;
    default_type            application/octet-stream;
    gzip                    on;
    keepalive_timeout       65;
    sendfile                on;
    server_tokens           off;
    tcp_nodelay             on;
    tcp_nopush              on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Home Assistant names the person behind an Ingress request in
    # X-Remote-User-Name, and identifies them in X-Remote-User-Id. Neither can
    # be reached by a browser: the Supervisor sets them itself and drops any
    # copy that arrived with the request.
    #
    # Home Assistant only strips and lowercases a username, so it may hold
    # anything at all, while FreshRSS accepts a far narrower set and refuses to
    # create an account outside of it. A name that does not fit falls back to
    # the user id, which is hexadecimal and therefore always fits. The account
    # is then named less prettily, which is the better half of that trade.
    map $http_x_remote_user_name $freshrss_ha_user_name {
        default                                               "";
        "~^([0-9a-zA-Z_][0-9a-zA-Z_.@-]{1,38}|[0-9a-zA-Z])$"  $http_x_remote_user_name;
    }

    map $freshrss_ha_user_name $freshrss_ingress_user {
        ""       $http_x_remote_user_id;
        default  $freshrss_ha_user_name;
    }

    include /etc/nginx/servers/*.conf;
}
