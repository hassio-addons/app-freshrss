[www]
; The web interface and the refresh service both write to the same SQLite
; databases and the same on-disk cache. The refresh service runs as root under
; the S6 supervision tree, so the pool matches it to keep every file in /data
; owned by a single user. Running the pool as root needs php-fpm's -R flag.
user = root
group = root
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 1024
clear_env = no
