[general]
; FreshRSS fetches feeds, favicons and page content over HTTP from within PHP.
allow_url_fopen = On
max_execution_time = 900
memory_limit = 512M
post_max_size = 64M
upload_max_filesize = 64M
session.cookie_httponly = 1
session.use_strict_mode = 1

; NGINX works out which script to run and hands over SCRIPT_FILENAME and
; PATH_INFO itself, so PHP must not go looking for a shorter path of its own.
; FreshRSS' Google Reader and Fever APIs depend on that split being left alone.
cgi.fix_pathinfo = 0

; FreshRSS keeps its own configuration, and that of every user, in PHP files
; that it includes. The refresh service rewrites some of those from the command
; line, in a process with an opcache of its own, so the pool serving the web
; interface has to keep checking whether what it cached is still current.
opcache.enable = 1
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 16384
opcache.memory_consumption = 128
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
